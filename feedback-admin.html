<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Feedback Inbox — DILOS.ai</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root {
      --bg: #0b1120; --card: #141d2e; --border: rgba(255,255,255,0.08);
      --text: #e8edf5; --muted: #8a9ab4; --blue: #0a74ff; --orange: #e8561e;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 0.3rem; }
    h1 .dot { color: var(--orange); }
    .lead { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.6rem; }
    form, .bar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.4rem; }
    input, select, button { font: inherit; font-size: 0.92rem; border-radius: 10px; padding: 0.65rem 0.9rem; }
    input, select { background: #0f1625; color: var(--text); border: 1.5px solid rgba(255,255,255,0.12); outline: none; }
    input:focus, select:focus { border-color: var(--blue); }
    input[type=password] { flex: 1; min-width: 220px; }
    button { background: var(--blue); color: #fff; border: none; font-weight: 700; cursor: pointer; }
    button.ghost { background: transparent; border: 1.5px solid rgba(255,255,255,0.16); color: var(--text); }
    .msg { color: #ff8f8f; font-size: 0.9rem; margin-bottom: 1rem; min-height: 1.2em; }
    .count { color: var(--muted); font-size: 0.85rem; margin-left: auto; }
    .item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.2rem; margin-bottom: 0.8rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem; }
    .tag { font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.2rem 0.55rem; border-radius: 999px; background: rgba(10,116,255,0.14); color: #8fbcff; }
    .tag.bug { background: rgba(239,68,68,0.14); color: #ff9a9a; }
    .tag.feature { background: rgba(48,186,94,0.14); color: #8ee0a8; }
    .tag.question { background: rgba(245,162,35,0.14); color: #f7c06a; }
    .body { white-space: pre-wrap; line-height: 1.6; font-size: 0.95rem; overflow-wrap: anywhere; }
    .from { margin-top: 0.7rem; font-size: 0.85rem; color: var(--muted); }
    .from a { color: #8fbcff; }
    .ua { margin-top: 0.3rem; font-size: 0.72rem; color: #5d6b84; overflow-wrap: anywhere; }
    .empty { color: var(--muted); text-align: center; padding: 3rem 0; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Feedback inbox<span class="dot">.</span></h1>
  <p class="lead">Messages sent from product pages on dilos.ai, newest first.</p>

  <form id="login">
    <input type="password" id="token" placeholder="Admin password" autocomplete="current-password" required />
    <button type="submit">Open</button>
  </form>

  <div class="bar" id="bar" hidden>
    <select id="product">
      <option value="">All products</option>
      <option value="dilos-photo">Dilos Photo</option>
    </select>
    <button type="button" class="ghost" id="reload">Refresh</button>
    <button type="button" class="ghost" id="logout">Lock</button>
    <span class="count" id="count"></span>
  </div>

  <div class="msg" id="msg" role="status"></div>
  <div id="list"></div>
</div>

<script>
  const KEY = 'dilosFeedbackToken';
  const login = document.getElementById('login');
  const bar = document.getElementById('bar');
  const list = document.getElementById('list');
  const msg = document.getElementById('msg');
  const product = document.getElementById('product');
  const count = document.getElementById('count');
  const KIND_NAMES = { feedback: 'Feedback', feature: 'Feature idea', bug: 'Problem', question: 'Question' };

  function getToken() { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } }
  function setToken(t) { try { t ? sessionStorage.setItem(KEY, t) : sessionStorage.removeItem(KEY); } catch {} }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function render(items) {
    list.replaceChildren();
    count.textContent = items.length + (items.length === 1 ? ' message' : ' messages');
    if (!items.length) { list.append(el('div', 'empty', 'No messages yet.')); return; }
    for (const f of items) {
      const item = el('div', 'item');
      const meta = el('div', 'meta');
      meta.append(el('span', 'tag ' + f.kind, KIND_NAMES[f.kind] || f.kind));
      meta.append(el('span', null, new Date(f.created_at).toLocaleString()));
      meta.append(el('span', null, f.product));
      if (f.country) meta.append(el('span', null, f.country));
      item.append(meta, el('div', 'body', f.message));
      if (f.name || f.email) {
        const from = el('div', 'from', 'From ' + (f.name || 'someone') + (f.email ? ' · ' : ''));
        if (f.email) {
          const a = el('a', null, f.email);
          a.href = 'mailto:' + encodeURIComponent(f.email) + '?subject=' + encodeURIComponent('Re: your Dilos Photo feedback');
          from.append(a);
        }
        item.append(from);
      }
      if (f.user_agent) item.append(el('div', 'ua', f.user_agent));
      list.append(item);
    }
  }

  async function load() {
    const token = getToken();
    if (!token) return;
    msg.textContent = 'Loading…';
    const query = product.value ? '?product=' + encodeURIComponent(product.value) : '';
    try {
      const res = await fetch('/api/feedback' + query, { headers: { Authorization: 'Bearer ' + token } });
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) { setToken(''); showLogin(); msg.textContent = 'Wrong password.'; return; }
      if (!res.ok) throw new Error(body.error || 'Could not load messages.');
      msg.textContent = '';
      login.hidden = true;
      bar.hidden = false;
      render(body.feedback || []);
    } catch (err) {
      msg.textContent = err.message;
    }
  }

  function showLogin() {
    login.hidden = false;
    bar.hidden = true;
    list.replaceChildren();
  }

  login.addEventListener('submit', e => {
    e.preventDefault();
    setToken(document.getElementById('token').value);
    document.getElementById('token').value = '';
    load();
  });
  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('logout').addEventListener('click', () => { setToken(''); showLogin(); msg.textContent = ''; });
  product.addEventListener('change', load);

  if (getToken()) load();
</script>
</body>
</html>
